<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dailymotion Video Downloader</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Dailymotion Video Downloader</h2>
  
  <div style="margin-bottom: 15px;">
    <input type="text" id="videoUrl" placeholder="Coller le lien ici..." style="width: 320px; padding: 10px;">
    <button onclick="downloadVideo()" style="padding: 10px 20px;">Download</button>
  </div>

  <p id="status"></p>

  <script>
    async function downloadVideo() {
      const url = document.getElementById('videoUrl').value;
      const status = document.getElementById('status');

      if (!url) {
        status.innerText = "Veuillez entrer un lien valide !";
        return;
      }

      status.innerText = "Recherche du lien de téléchargement...";

      try {
        const response = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!response.ok || !data.directUrl) {
          throw new Error('Erreur lors de la récupération du lien');
        }

        status.innerText = "Téléchargement en cours...";

        // فتح رابط الفيديو المباشر للتحميل الفوري
        const a = document.createElement('a');
        a.href = data.directUrl;
        a.download = "video.mp4";
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.innerText = "Téléchargement lancé !";
      } catch (err) {
        status.innerText = "Erreur: " + err.message;
      }
    }
  </script>
</body>
</html>
