<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dailymotion Video Downloader</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Dailymotion Video Downloader</h2>
  
  <form id="downloadForm" action="/download" method="POST" style="margin-bottom: 15px;">
    <input type="text" name="url" id="videoUrl" placeholder="Coller le lien ici..." style="width: 320px; padding: 10px;" required>
    <button type="submit" style="padding: 10px 20px;">Download</button>
  </form>

  <p id="status"></p>

  <script>
    document.getElementById('downloadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const url = document.getElementById('videoUrl').value;
      const status = document.getElementById('status');

      status.innerText = "Démarrage du téléchargement...";

      try {
        const response = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        if (!response.ok) throw new Error("Erreur du serveur");

        const reader = response.body.getReader();
        const stream = new ReadableStream({
          start(controller) {
            function push() {
              reader.read().then(({ done, value }) => {
                if (done) {
                  controller.close();
                  return;
                }
                controller.enqueue(value);
                push();
              });
            }
            push();
          }
        });

        const responseStream = new Response(stream);
        const blob = await responseStream.blob();
        
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = "video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        status.innerText = "Téléchargement terminé !";
      } catch (err) {
        status.innerText = "Erreur: Téléchargement échoué.";
      }
    });
  </script>
</body>
</html>
