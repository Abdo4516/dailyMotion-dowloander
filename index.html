<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dailymotion Video Downloader</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Dailymotion Video Downloader</h2>
  
  <div style="margin-bottom: 15px;">
    <input type="text" id="videoUrl" placeholder="Coller le lien ici..." style="width: 320px; padding: 10px;">
    <button onclick="downloadVideo()" style="padding: 10px 20px;">Download</button>
  </div>

  <p id="status"></p>

  <script>
    async function downloadVideo() {
      const url = document.getElementById('videoUrl').value;
      const status = document.getElementById('status');

      if (!url) {
        status.innerText = "Veuillez entrer un lien valide !";
        return;
      }

      status.innerText = "Téléchargement en cours...";

      try {
        const response = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        if (!response.ok) {
          throw new Error("Erreur de téléchargement depuis le serveur.");
        }

        const blob = await response.blob();
        
        if (blob.size === 0) {
          throw new Error("Le fichier reçu est vide.");
        }

        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = "video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        status.innerText = "Téléchargement terminé !";
      } catch (err) {
        status.innerText = "Erreur: " + err.message;
      }
    }
  </script>
</body>
</html>
